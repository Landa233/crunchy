[package]
name = "z_n_gauge"
version = "0.1.0"
edition = "2021"
build = "build.rs"


[dependencies]
colored = "2.1.0"
crunchy = { path = "../" }
ndarray = "0.15.6"
npyz = { version = "0.8.2", features = ["npz", "derive"] }
byteorder = "*"
zip = { version = "0.6" }
rand = "0.8.5"
rand_core = "0.6.4"
rand_pcg = { version = "0.3.1", features = ["serde1"] }


serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.80"

bincode = "1.3.3"
chrono = "0.4.37"

rs_to_npy = { path = "../rs_to_npy" }
rs-to-npy-macros = { path = "../rs_to_npy/rs-to-npy-macros" }

[build-dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.80"


chrono = "0.4.37"
